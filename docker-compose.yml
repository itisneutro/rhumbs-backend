name: rhumbs

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: rhumbs-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rhumbs-data:/data

  redis:
    image: redis:7-alpine
    container_name: rhumbs-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:18-alpine
    container_name: rhumbs-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "5432:5432"
    volumes:
      - rhumbs-db:/var/lib/postgresql

  adminer:
    image: adminer:6.0.1
    container_name: rhumbs-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  rhumbs-data:
  rhumbs-db:
